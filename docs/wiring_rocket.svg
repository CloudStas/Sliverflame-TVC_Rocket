<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1110" width="1400" height="1110" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .blk { fill: #f6f7f9; stroke: #333; stroke-width: 1.5; }
    .esp { fill: #e8f0fb; stroke: #1f4e8c; stroke-width: 2; }
    .wago { fill: #fff4d6; stroke: #a07400; stroke-width: 1.5; }
    .pyroblk { fill: #fde8ef; stroke: #a0154b; stroke-width: 1.5; }
    .res { fill: #fff; stroke: #333; stroke-width: 1.2; }
    .t  { font-size: 14px; fill: #111; }
    .tb { font-size: 15px; fill: #111; font-weight: 700; }
    .s  { font-size: 12px; fill: #333; }
    .xs { font-size: 10.5px; fill: #333; }
    .pin { font-size: 12px; fill: #1f4e8c; }
    .bat  { stroke: #d62728; stroke-width: 3; fill: none; }
    .pyro { stroke: #c2185b; stroke-width: 3; fill: none; }
    .v5   { stroke: #ff7f0e; stroke-width: 2.5; fill: none; }
    .sig  { stroke: #1f77b4; stroke-width: 2; fill: none; }
    .i2c  { stroke: #17a2b8; stroke-width: 2; fill: none; }
    .adc  { stroke: #6a51a3; stroke-width: 1.8; fill: none; }
    .gnd  { stroke: #000; stroke-width: 2; fill: none; }
    .dot  { fill: #000; }
  </style>
  <defs>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/>
      <line x1="-9" y1="8" x2="9" y2="8" stroke="#000" stroke-width="2"/>
      <line x1="-6" y1="12" x2="6" y2="12" stroke="#000" stroke-width="2"/>
      <line x1="-3" y1="16" x2="3" y2="16" stroke="#000" stroke-width="2"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1400" height="1110" fill="#ffffff"/>
  <text x="30" y="38" style="font-size:22px;font-weight:700;fill:#111">Sliverflame: rocket flight computer wiring (ESP32 #1)</text>
  <text x="30" y="58" class="s">Hand-wired with lever nuts (“WAGO”) and the ESP32 screw-terminal board. Every ⏚ symbol is the same ground (WAGO 4: GND).</text>

  <!-- ================= POWER INPUT ================= -->
  <rect x="30" y="80" width="170" height="80" rx="6" class="blk"/>
  <text x="115" y="105" text-anchor="middle" class="tb">2S LiPo</text>
  <text x="115" y="124" text-anchor="middle" class="s">7.4 V nominal, 2200 mAh</text>
  <text x="115" y="142" text-anchor="middle" class="s">XT60 connector</text>
  <text x="206" y="96" class="t">+</text>
  <text x="206" y="138" class="t">−</text>
  <path d="M200 140 H215 V172" class="gnd"/>
  <use xlink:href="#gnd" href="#gnd" x="215" y="172"/>

  <path d="M200 100 H240" class="bat"/>
  <rect x="240" y="85" width="90" height="30" rx="4" class="blk"/>
  <text x="285" y="105" text-anchor="middle" class="s">F1 fuse 10 A</text>
  <path d="M330 100 H360" class="bat"/>
  <rect x="360" y="85" width="120" height="30" rx="4" class="blk"/>
  <text x="420" y="105" text-anchor="middle" class="s">SW1 main power</text>
  <path d="M480 100 H510" class="bat"/>
  <rect x="510" y="70" width="130" height="70" rx="6" class="wago"/>
  <text x="575" y="96" text-anchor="middle" class="t">WAGO 1</text>
  <text x="575" y="114" text-anchor="middle" class="s">BAT+ (5-port)</text>

  <!-- servo UBEC -->
  <path d="M640 95 H680" class="bat"/>
  <rect x="680" y="70" width="190" height="60" rx="6" class="blk"/>
  <text x="775" y="94" text-anchor="middle" class="t">UBEC 8 A (servos)</text>
  <text x="775" y="113" text-anchor="middle" class="s">output jumper → 5 V</text>
  <path d="M775 130 V140" class="gnd"/>
  <use xlink:href="#gnd" href="#gnd" x="775" y="140"/>
  <path d="M870 95 H900" class="v5"/>
  <rect x="900" y="70" width="130" height="50" rx="6" class="wago"/>
  <text x="965" y="92" text-anchor="middle" class="t">WAGO 2</text>
  <text x="965" y="110" text-anchor="middle" class="s">SERVO +5 V</text>
  <!-- servo +5V rail -->
  <path d="M1030 95 H1375 V535" class="v5"/>

  <!-- BAT+ trunk down the left side -->
  <path d="M530 140 V205 H40 V960 H90" class="bat"/>
  <circle cx="40" cy="262" r="4" class="dot"/>
  <path d="M40 262 H160 V300" class="bat"/>

  <!-- logic BEC -->
  <rect x="70" y="300" width="180" height="70" rx="6" class="blk"/>
  <text x="160" y="326" text-anchor="middle" class="t">BEC 3 A (logic)</text>
  <text x="160" y="346" text-anchor="middle" class="s">set output → 5 V</text>
  <path d="M160 370 V384" class="gnd"/>
  <use xlink:href="#gnd" href="#gnd" x="160" y="384"/>
  <path d="M250 340 H330" class="v5"/>
  <text x="290" y="333" text-anchor="middle" class="xs">5 V</text>

  <!-- ================= ESP32 ================= -->
  <rect x="330" y="300" width="280" height="590" rx="8" class="esp"/>
  <text x="470" y="440" text-anchor="middle" class="tb">ESP32 #1</text>
  <text x="470" y="460" text-anchor="middle" class="s">flight computer</text>
  <text x="470" y="478" text-anchor="middle" class="s">ESP-WROOM-32 DevKit</text>
  <text x="470" y="496" text-anchor="middle" class="s">on screw-terminal board</text>

  <!-- left pins -->
  <text x="340" y="344" class="pin">5V / VIN</text>
  <text x="340" y="384" class="pin">GND</text>
  <path d="M330 380 H312 V392" class="gnd"/>
  <use xlink:href="#gnd" href="#gnd" x="312" y="392"/>
  <text x="340" y="424" class="pin">3V3</text>
  <path d="M330 420 H300" stroke="#555" stroke-width="2"/>
  <text x="296" y="424" text-anchor="end" class="s">3V3 → sensors</text>

  <!-- right pins -->
  <g class="pin" text-anchor="end">
    <text x="600" y="344">GPIO21 SDA</text>
    <text x="600" y="379">GPIO22 SCL</text>
    <text x="600" y="434">GPIO25</text>
    <text x="600" y="469">GPIO26</text>
    <text x="600" y="504">GPIO27</text>
    <text x="600" y="539">GPIO33</text>
    <text x="600" y="604">GPIO18</text>
    <text x="600" y="639">GPIO19</text>
    <text x="600" y="674">GPIO23</text>
    <text x="600" y="734">GPIO34 (ADC)</text>
    <text x="600" y="779">GPIO35 (ADC)</text>
    <text x="600" y="824">GPIO36 / VP</text>
    <text x="600" y="869">GPIO39 / VN</text>
  </g>

  <!-- ================= I2C SENSORS ================= -->
  <path d="M610 340 H660 V260 H1000" class="i2c"/>
  <path d="M610 375 H680 V280 H1000" class="i2c"/>
  <text x="1006" y="264" class="xs">SDA</text>
  <text x="1006" y="284" class="xs">SCL</text>

  <rect x="700" y="165" width="170" height="65" rx="6" class="blk"/>
  <text x="785" y="186" text-anchor="middle" class="t">MPU6050 (GY-521)</text>
  <text x="785" y="203" text-anchor="middle" class="xs">VCC → 3V3, GND → ⏚</text>
  <text x="740" y="224" text-anchor="middle" class="xs">SDA</text>
  <text x="790" y="224" text-anchor="middle" class="xs">SCL</text>
  <path d="M740 230 V260" class="i2c"/><circle cx="740" cy="260" r="3.5" class="dot"/>
  <path d="M790 230 V280" class="i2c"/><circle cx="790" cy="280" r="3.5" class="dot"/>

  <rect x="890" y="165" width="170" height="65" rx="6" class="blk"/>
  <text x="975" y="186" text-anchor="middle" class="t">BMP280</text>
  <text x="975" y="203" text-anchor="middle" class="xs">VCC → 3V3 only, GND → ⏚</text>
  <text x="930" y="224" text-anchor="middle" class="xs">SDA</text>
  <text x="980" y="224" text-anchor="middle" class="xs">SCL</text>
  <path d="M930 230 V260" class="i2c"/><circle cx="930" cy="260" r="3.5" class="dot"/>
  <path d="M980 230 V280" class="i2c"/><circle cx="980" cy="280" r="3.5" class="dot"/>

  <!-- ================= SERVOS ================= -->
  <path d="M610 430 H1100" class="sig"/>
  <path d="M610 465 H1100" class="sig"/>
  <path d="M610 500 H1100" class="sig"/>
  <path d="M610 535 H1100" class="sig"/>
  <rect x="1100" y="415" width="240" height="30" rx="4" class="blk"/>
  <text x="1110" y="435" class="s">Servo 1: TVC pitch (motor tube)</text>
  <rect x="1100" y="450" width="240" height="30" rx="4" class="blk"/>
  <text x="1110" y="470" class="s">Servo 2: TVC yaw (X-axis ring)</text>
  <rect x="1100" y="485" width="240" height="30" rx="4" class="blk"/>
  <text x="1110" y="505" class="s">Servo 3: throttle arm LEFT</text>
  <rect x="1100" y="520" width="240" height="30" rx="4" class="blk"/>
  <text x="1110" y="540" class="s">Servo 4: throttle arm RIGHT</text>
  <path d="M1340 430 H1375 M1340 465 H1375 M1340 500 H1375 M1340 535 H1375" class="v5"/>
  <circle cx="1375" cy="430" r="3.5" class="dot"/><circle cx="1375" cy="465" r="3.5" class="dot"/><circle cx="1375" cy="500" r="3.5" class="dot"/>
  <text x="1100" y="405" class="xs">orange = signal · red = +5 V rail · brown = ⏚ (WAGO 4)</text>

  <!-- ================= PYRO POWER ================= -->
  <rect x="90" y="945" width="90" height="30" rx="4" class="blk"/>
  <text x="135" y="965" text-anchor="middle" class="s">F2 fuse 5 A</text>
  <path d="M180 960 H220" class="pyro"/>
  <rect x="220" y="945" width="150" height="30" rx="4" class="pyroblk"/>
  <text x="295" y="965" text-anchor="middle" class="s">SW2 ARM (pyro)</text>
  <path d="M370 960 H410" class="pyro"/>
  <rect x="410" y="930" width="130" height="60" rx="6" class="wago"/>
  <text x="475" y="955" text-anchor="middle" class="t">WAGO 3</text>
  <text x="475" y="973" text-anchor="middle" class="s">PYRO+ (armed)</text>
  <path d="M540 960 H920 V860" class="pyro"/>

  <!-- ================= MOSFET MODULE ================= -->
  <path d="M610 600 H800" class="sig"/>
  <path d="M610 635 H800" class="sig"/>
  <path d="M610 670 H800" class="sig"/>
  <rect x="800" y="580" width="230" height="280" rx="6" class="pyroblk"/>
  <text x="915" y="760" text-anchor="middle" class="tb">4-ch MOSFET</text>
  <text x="915" y="778" text-anchor="middle" class="tb">module</text>
  <text x="915" y="797" text-anchor="middle" class="xs">low-side switch, needs</text>
  <text x="915" y="810" text-anchor="middle" class="xs">3.3 V-logic inputs</text>
  <g class="xs">
    <text x="808" y="604">IN1</text>
    <text x="808" y="639">IN2</text>
    <text x="808" y="674">IN3</text>
    <text x="808" y="709">IN4 (spare)</text>
    <text x="830" y="852" text-anchor="middle">GND</text>
    <text x="920" y="852" text-anchor="middle">V+</text>
    <text x="1000" y="852" text-anchor="middle">V−</text>
    <text x="1022" y="604" text-anchor="end">OUT1+</text>
    <text x="1022" y="629" text-anchor="end">OUT1−</text>
    <text x="1022" y="674" text-anchor="end">OUT2+</text>
    <text x="1022" y="699" text-anchor="end">OUT2−</text>
    <text x="1022" y="744" text-anchor="end">OUT3+</text>
    <text x="1022" y="769" text-anchor="end">OUT3−</text>
  </g>
  <path d="M830 860 V872" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="830" y="872"/>
  <path d="M1000 860 V872" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="1000" y="872"/>

  <!-- igniter loops -->
  <g>
    <path d="M1030 600 H1075 M1135 600 H1180" class="pyro"/>
    <rect x="1075" y="593" width="60" height="14" class="res"/>
    <text x="1105" y="589" text-anchor="middle" class="xs">1 Ω 5 W</text>
    <path d="M1030 625 H1180" class="pyro"/>
    <text x="1060" y="640" class="xs" fill="#6a51a3">= CONT1</text>
    <rect x="1180" y="588" width="185" height="48" rx="6" class="blk"/>
    <text x="1272" y="608" text-anchor="middle" class="s">Igniter 1: ASCENT motor</text>
    <text x="1272" y="625" text-anchor="middle" class="xs">Estes starter in nozzle</text>
  </g>
  <g>
    <path d="M1030 670 H1075 M1135 670 H1180" class="pyro"/>
    <rect x="1075" y="663" width="60" height="14" class="res"/>
    <text x="1105" y="659" text-anchor="middle" class="xs">1 Ω 5 W</text>
    <path d="M1030 695 H1180" class="pyro"/>
    <text x="1060" y="710" class="xs" fill="#6a51a3">= CONT2</text>
    <rect x="1180" y="658" width="185" height="48" rx="6" class="blk"/>
    <text x="1272" y="678" text-anchor="middle" class="s">Igniter 2: LANDING motor</text>
    <text x="1272" y="695" text-anchor="middle" class="xs">Estes starter in nozzle</text>
  </g>
  <g>
    <path d="M1030 740 H1075 M1135 740 H1180" class="pyro"/>
    <rect x="1075" y="733" width="60" height="14" class="res"/>
    <text x="1105" y="729" text-anchor="middle" class="xs">1 Ω 5 W</text>
    <path d="M1030 765 H1180" class="pyro"/>
    <text x="1060" y="780" class="xs" fill="#6a51a3">= CONT3</text>
    <rect x="1180" y="728" width="185" height="48" rx="6" class="blk"/>
    <text x="1272" y="748" text-anchor="middle" class="s">Nichrome: leg release</text>
    <text x="1272" y="765" text-anchor="middle" class="xs">~2 cm of 32 AWG, burns band</text>
  </g>

  <!-- ================= CONTINUITY + BATTERY SENSE DIVIDERS ================= -->
  <!-- template: pin -> node(640) ; 100k to tag ; 33k node -> GND -->
  <g>
    <path d="M610 730 H650 M700 730 H730" class="adc"/>
    <circle cx="640" cy="730" r="3.5" class="dot"/>
    <rect x="650" y="723" width="50" height="14" class="res"/><text x="675" y="734" text-anchor="middle" class="xs">100k</text>
    <text x="734" y="734" class="xs" fill="#6a51a3">CONT1</text>
    <path d="M640 730 V737" class="adc"/><rect x="634" y="737" width="12" height="13" class="res"/>
    <text x="630" y="752" text-anchor="end" class="xs">33k</text>
    <path d="M640 750 V751" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="640" y="751"/>
  </g>
  <g>
    <path d="M610 775 H650 M700 775 H730" class="adc"/>
    <circle cx="640" cy="775" r="3.5" class="dot"/>
    <rect x="650" y="768" width="50" height="14" class="res"/><text x="675" y="779" text-anchor="middle" class="xs">100k</text>
    <text x="734" y="779" class="xs" fill="#6a51a3">CONT2</text>
    <path d="M640 775 V782" class="adc"/><rect x="634" y="782" width="12" height="13" class="res"/>
    <text x="630" y="797" text-anchor="end" class="xs">33k</text>
    <path d="M640 795 V796" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="640" y="796"/>
  </g>
  <g>
    <path d="M610 820 H650 M700 820 H730" class="adc"/>
    <circle cx="640" cy="820" r="3.5" class="dot"/>
    <rect x="650" y="813" width="50" height="14" class="res"/><text x="675" y="824" text-anchor="middle" class="xs">100k</text>
    <text x="734" y="824" class="xs" fill="#6a51a3">CONT3</text>
    <path d="M640 820 V827" class="adc"/><rect x="634" y="827" width="12" height="13" class="res"/>
    <text x="630" y="842" text-anchor="end" class="xs">33k</text>
    <path d="M640 840 V841" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="640" y="841"/>
  </g>
  <g>
    <path d="M610 865 H650 M700 865 H730" class="adc"/>
    <circle cx="640" cy="865" r="3.5" class="dot"/>
    <rect x="650" y="858" width="50" height="14" class="res"/><text x="675" y="869" text-anchor="middle" class="xs">100k</text>
    <text x="734" y="869" class="xs" fill="#d62728">BAT+</text>
    <path d="M640 865 V872" class="adc"/><rect x="634" y="872" width="12" height="13" class="res"/>
    <text x="630" y="887" text-anchor="end" class="xs">33k</text>
    <path d="M640 885 V886" class="gnd"/><use xlink:href="#gnd" href="#gnd" x="640" y="886"/>
  </g>

  <!-- ================= NOTES ================= -->
  <rect x="1060" y="800" width="315" height="285" rx="8" fill="#fbfbfb" stroke="#999"/>
  <text x="1075" y="824" class="tb">Notes</text>
  <g class="s">
    <text x="1075" y="848">• SW1 = main power. SW2 = pyro arm: keep it</text>
    <text x="1075" y="864">  OFF until the rocket is on the pad.</text>
    <text x="1075" y="886">• Pyro GPIO 18 / 19 / 23 stay LOW at boot.</text>
    <text x="1075" y="902">  Never use GPIO 0, 2, 5, 12, 15 for pyro.</text>
    <text x="1075" y="924">• CONT pin ≈ 2.1 V = armed and igniter OK.</text>
    <text x="1075" y="940">  ≈ 0 V = open igniter or SW2 off.</text>
    <text x="1075" y="962">• 1 Ω in series → ~4–5 A ignition pulse.</text>
    <text x="1075" y="984">• Servo UBEC at 5 V (ES3352: 4.8–6 V).</text>
    <text x="1075" y="1006">• Use ADC1 pins only (32–39): ADC2 stops</text>
    <text x="1075" y="1022">  working while ESP-NOW / Wi-Fi is on.</text>
    <text x="1075" y="1044">• MPU6050 = 0x68, BMP280 = 0x76/0x77:</text>
    <text x="1075" y="1060">  same I²C bus, no address clash.</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(30,1020)">
    <text x="0" y="0" class="tb">Legend</text>
    <path d="M0 22 H40" class="bat"/><text x="48" y="26" class="s">battery + (switched)</text>
    <path d="M190 22 H230" class="pyro"/><text x="238" y="26" class="s">pyro + (only when armed)</text>
    <path d="M400 22 H440" class="v5"/><text x="448" y="26" class="s">regulated 5 V</text>
    <path d="M560 22 H600" class="sig"/><text x="608" y="26" class="s">3.3 V logic signal</text>
    <path d="M0 52 H40" class="i2c"/><text x="48" y="56" class="s">I²C</text>
    <path d="M190 52 H230" class="adc"/><text x="238" y="56" class="s">analog sense</text>
    <use xlink:href="#gnd" href="#gnd" x="420" y="42"/><text x="448" y="56" class="s">ground (WAGO 4)</text>
    <circle cx="580" cy="52" r="4" class="dot"/><text x="592" y="56" class="s">wires joined</text>
  </g>
</svg>
